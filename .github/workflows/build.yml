name: Build Aura OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run in Arch Linux Container
        uses: archlinux/archlinux:latest
        with:
          exec: |
            pacman -Syu --noconfirm archiso python python-pip tk
            PY_VER=$(python3 -c "import sys; print(f'python{sys.version_info.major}.{sys.version_info.minor}')")
            pip install customtkinter arabic-reshaper python-bidi \
              --target=airootfs/usr/lib/$PY_VER/site-packages/ \
              --break-system-packages
            mkarchiso -v -w work/ -o out/ .

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-ISO
          path: out/*.iso
