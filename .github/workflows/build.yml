name: Build AuraOS ISO

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من GitHub
  push:
    branches:
      - main # يتم البناء تلقائياً عند الدفع لفرع main

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # ضروري جداً لتشغيل archiso والسماح بتركيب (Mount) الملفات الوهمية
      options: --privileged 

    steps:
      - name: Checkout aura-welcome Repository
        uses: actions/checkout@v4
        with:
          path: aura-welcome # جلب المستودع الخاص بالترحيب

      - name: Update System & Install Build Tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel python python-pip

      - name: Setup Archiso Profile
        run: |
          # نسخ القالب الافتراضي لـ archiso لبناء التوزيعة
          cp -r /usr/share/archiso/configs/releng ./auraos-profile
          
          # إضافة الحزم الأساسية التي يتطلبها سكربت الترحيب داخل ملف الحزم
          cat <<EOF >> ./auraos-profile/packages.x86_64
          python
          python-pip
          noto-fonts # لدعم خط Noto Sans Arabic
          ttf-liberation # كبديل قياسي لدعم خط Arial
          discover # لدعم فتح مركز التطبيقات plasma-discover
          EOF

      - name: Inject aura-welcome Script into ISO
        run: |
          # إنشاء مسار البرنامج داخل النظام المستقبلي (ISO)
          mkdir -p ./auraos-profile/airootfs/opt/aura-welcome
          
          # نسخ ملفات المستودع بالكامل إلى النظام الوهمي
          cp -r ./aura-welcome/* ./auraos-profile/airootfs/opt/aura-welcome/
          
          # إعطاء صلاحية التنفيذ للسكربت
          chmod +x ./auraos-profile/airootfs/opt/aura-welcome/*.py

      - name: Configure dependencies installation inside ISO
        run: |
          # إضافة أمر تثبيت مكتبات بايثون المطلوبة داخل سكربت التهيئة الخاص بـ archiso
          # يتم إضافة --break-system-packages لضمان التثبيت على مستوى النظام الأساسي
          echo 'pip install customtkinter arabic-reshaper python-bidi --break-system-packages' >> ./auraos-profile/airootfs/root/customize_airootfs.sh
          
          # التأكد من قابلية تشغيل ملف التهيئة
          chmod +x ./auraos-profile/airootfs/root/customize_airootfs.sh

      - name: Build AuraOS ISO
        run: |
          # بدء عملية بناء التوزيعة
          mkarchiso -v -w /tmp/archiso-tmp -o ./out ./auraos-profile

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-ISO
          path: ./out/*.iso
